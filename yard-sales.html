<!doctype html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Yard &amp; Estate Sales of the Holds</title>
<style>
  :root {
    --bg: #241a12; --paper: #f3eee3; --ink: #211e19; --muted: #6b6257;
    --wood: #542d1b; --wood-deep: #2f1a12; --ember: #b54f24; --gold: #e8b64c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: radial-gradient(120% 90% at 50% 0%, #3a2a1c 0%, var(--bg) 60%, #180f09 100%);
    color: var(--paper); font-family: "Trebuchet MS", "Source Sans 3", sans-serif;
    min-height: 100vh; display: flex; flex-direction: column; align-items: center;
    padding: 24px 20px 28px; justify-content: center;
  }
  .wrap { width: 100%; max-width: 520px; }
  a.back {
    display: inline-block; margin-bottom: 18px; padding: 10px 16px; min-height: 44px;
    color: var(--gold); font-weight: 700; text-decoration: none;
    border: 2px solid #8f8068; border-radius: 10px; background: rgba(0,0,0,.25);
  }
  h1 {
    font-family: Georgia, serif; font-size: 1.7rem; margin: 0 0 2px;
    color: var(--gold); letter-spacing: 1px; text-align: center;
  }
  .sub { color: #c9bda9; margin: 0 0 18px; text-align: center; font-size: .95rem; }
  a.btn {
    display: block; text-decoration: none; color: var(--ink);
    background: linear-gradient(180deg, #f7f1e4, #e9dfc9);
    border: 2px solid #8f8068; border-radius: 10px;
    padding: 14px 18px; box-shadow: 0 8px 22px rgba(0,0,0,.45);
  }
  a.btn:active { transform: translateY(2px); box-shadow: 0 4px 12px rgba(0,0,0,.45); }
  a.btn .t { display: block; font-size: 1.15rem; font-weight: 700; font-family: Georgia, serif; color: var(--wood-deep); }
  a.btn .d { display: block; margin-top: 2px; color: var(--muted); font-size: .88rem; }
  footer { margin-top: 20px; color: #8a7c68; font-size: .78rem; text-align: center; }
</style>
</head>
<body>
  <div class="wrap">
    <a class="back" href="https://claypnw.github.io/menu/">← Menu</a>
    <h1>Yard &amp; Estate Sales</h1>
    <p class="sub">Garage sales, yard sales, and estate sales around the Holds — rebuilt every morning.</p>
    <a class="btn" href="payson-yard-estate-sales.pdf">
      <span class="t">Open this week's sheet</span>
      <span class="d">PDF — opens in your PDF reader</span>
    </a>
    <footer>Made for the Hearth · opens in your browser, no apps needed</footer>
  </div>
